name: Publish to PyPI

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build:
        name: Build distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build tooling
              run: python -m pip install --upgrade build twine

            - name: Build sdist and wheel
              run: python -m build

            - name: Check distribution metadata
              run: python -m twine check dist/*

            - name: Verify built version matches tag
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  built_version="$(python -m setuptools_scm)"
                  tag_version="${GITHUB_REF_NAME#v}"
                  if [ "$built_version" != "$tag_version" ]; then
                    echo "::error::Built version ($built_version) does not match tag ($tag_version)"
                    exit 1
                  fi

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    publish:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/project/dualsensepy/
        permissions:
            id-token: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
