[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsensepy"
version = "0.1.2"
description = "Python library for interacting with DualSense controllers (input states, LEDs, adaptive triggers) via HIDAPI or SDL3 backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Benjamin Heuberger", email = "beni.heu@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["dualsense", "ps5", "playstation", "controller", "gamepad", "hidapi", "sdl3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySDL3==0.9.7b9",
    "hidapi-py==0.1.2",
    "reactivex==4.0.4",
]

[project.urls]
Homepage = "https://github.com/Rothen/dualsensepy"
Repository = "https://github.com/Rothen/dualsensepy"
Issues = "https://github.com/Rothen/dualsensepy/issues"

[tool.setuptools.packages.find]
include = ["dualsensepy*"]

[tool.setuptools.package-data]
dualsensepy = ["py.typed"]
